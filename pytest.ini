[pytest]
# Only collect tests from the dedicated tests/ directory.
# This prevents pytest from importing the root-level CLI scripts
# (test_ocr_space.py, test_qwen.py) that call sys.exit() at module level.
testpaths = tests

# Add the workspace root to sys.path so tests can import project modules
# (database, analytics, validation, etc.) without installation.
pythonpath = .
